id: contrib
name: GitHub Contributions
version: "1.0.0"
author: DaiconMan
license: MIT
kind: widget
category: dev
description: "GitHub contribution heatmap with totals and the current streak (needs providers.contrib)."
needs: [time, contrib]
default_size:
  width: auto
  height: auto
settings:
  weeks:
    type: integer
    default: 13
    min: 4
    max: 26
    description: "Weeks shown, including the current one"
i18n:
  ja:
    name: "GitHub ヒートマップ"
    description: "GitHub の活動量と連続日数"
    settings:
      weeks: "表示する週数"
