id: launches
name: Rocket Launches
version: "1.0.0"
author: DaiconMan
license: MIT
kind: widget
category: life
description: "Next rocket launch with a T− countdown, then the following launches."
needs: [time, launches]
default_size:
  width: auto
  height: auto
settings:
  more:
    type: integer
    default: 3
    min: 0
    max: 8
    description: "Further launches listed under the next one"
i18n:
  ja:
    name: "ロケット打ち上げ"
    description: "次の打ち上げまでの T− カウントダウン"
    settings:
      more: "続けて表示する打ち上げの件数"
