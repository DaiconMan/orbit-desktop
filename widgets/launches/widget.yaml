id: launches
name: Rocket Launches
version: "1.0.0"
author: DaiconMan
license: MIT
kind: widget
description: "Next rocket launch (mission, rocket, provider, site) with a T− countdown and status, then the following launches. Data: The Space Devs via the launches provider. Hidden when nothing is scheduled."
needs: [time, launches]
default_size:
  width: auto
  height: auto
settings:
  more:
    type: integer
    default: 3
    min: 0
    max: 8
    description: "Further launches listed under the next one"
