id: progress
name: Progress
version: "1.0.0"
author: DaiconMan
license: MIT
kind: widget
category: time
description: "Thin bars for how much of the day, week, month and year has passed."
needs: [time]
default_size:
  width: auto
  height: auto
settings:
  bars:
    type: list
    items: { type: enum, options: [day, week, month, year], default: day }
    default: [day, week, month, year]
    description: "Which bars to show, in order"
  week_starts_monday:
    type: boolean
    default: true
    description: "Week runs Monday–Sunday (off = Sunday–Saturday)"
i18n:
  ja:
    name: "進み具合"
    description: "今日・今週・今月・今年の経過"
    settings:
      bars: "表示するバーと順番（day / week / month / year）"
      week_starts_monday: "週の始まりを月曜にする"
