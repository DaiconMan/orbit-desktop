id: month
name: Month Calendar
version: "1.0.0"
author: DaiconMan
license: MIT
kind: widget
category: time
description: "Month calendar with holidays in red, today ringed and dots on days with events."
needs: [time, calendar, holidays]
default_size:
  width: auto
  height: auto
settings:
  event_dots:
    type: boolean
    default: true
    description: "Dot under days that have calendar events (within the range the calendar provider exports)"
  holiday_list:
    type: boolean
    default: true
    description: "List this month's holidays under the grid"
i18n:
  ja:
    name: "月カレンダー"
    description: "今月のカレンダーと祝日"
    settings:
      event_dots: "予定のある日に点を付ける"
      holiday_list: "今月の祝日を下に一覧表示"
