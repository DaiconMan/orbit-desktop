id: sky
name: Sky Chart
version: "1.0.0"
author: DaiconMan
license: MIT
kind: widget
category: weather
description: "Small sky chart of the Sun, Moon, planets and ISS overhead (zenith centre, north up)."
needs: [time, location, iss]
default_size:
  width: auto
  height: auto
settings:
  iss:
    type: boolean
    default: true
    description: "Plot the ISS (needs providers.iss.enabled: true)"
  labels:
    type: boolean
    default: true
    description: "Japanese name labels next to each body (dropped when they would collide)"
i18n:
  ja:
    name: "星図"
    description: "太陽・月・惑星・ISS の位置"
    settings:
      iss: "ISS を表示"
      labels: "天体名を表示"
