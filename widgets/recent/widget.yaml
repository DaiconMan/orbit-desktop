id: recent
name: Recent Tracks
version: "1.0.0"
author: DaiconMan
license: MIT
kind: widget
category: media
description: "The last tracks you played, with how long ago."
needs: [time, recent, nowPlaying]
default_size:
  width: auto
  height: auto
settings:
  count:
    type: integer
    default: 5
    min: 1
    max: 10
    description: "Tracks shown"
i18n:
  ja:
    name: "最近の曲"
    description: "最近再生した曲"
    settings:
      count: "表示する曲数"
