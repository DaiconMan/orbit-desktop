id: world
name: World Clock
version: "1.0.0"
author: DaiconMan
license: MIT
kind: widget
category: time
description: "Time in other time zones with the offset from local time and 昨日 / 明日 marks."
needs: [time]
default_size:
  width: auto
  height: auto
settings:
  clocks:
    type: list
    default:
      - { label: TOKYO, tz: Asia/Tokyo }
      - { label: UTC, tz: UTC }
      - { label: NEW YORK, tz: America/New_York }
      - { label: LONDON, tz: Europe/London }
    description: "Tiles, each {label, tz} with an IANA time zone (two per row)"
  home_tz:
    type: string
    default: ""
    description: "Reference zone for the offsets and day marks (empty = system time zone)"
i18n:
  ja:
    name: "世界時計"
    description: "各地の時刻と時差"
    settings:
      clocks: "表示する都市（表示名とタイムゾーン）"
      home_tz: "基準のタイムゾーン（空欄 = この Mac）"
