id: week
name: Week Agenda
version: "1.0.0"
author: DaiconMan
license: MIT
kind: widget
category: time
description: "Agenda of the coming days from your calendar, grouped by day with holidays marked."
needs: [time, calendar, holidays]
default_size:
  width: auto
  height: auto
settings:
  days:
    type: integer
    default: 7
    min: 1
    max: 8
    description: "Days ahead after tomorrow's (the calendar provider exports today + 8 days)"
  max_rows:
    type: integer
    default: 9
    min: 3
    max: 20
    description: "Maximum rows (day headers + events) before the rest is cut"
  include_today:
    type: boolean
    default: false
    description: "Also list today's events"
i18n:
  ja:
    name: "今週の予定"
    description: "明日からの予定を日ごとに"
    settings:
      days: "明日から何日先まで"
      max_rows: "最大の行数"
      include_today: "今日の予定も含める"
