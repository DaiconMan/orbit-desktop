id: countdown
name: Countdown
version: "1.0.0"
author: DaiconMan
license: MIT
kind: widget
category: time
description: "Time until the next meeting, public holiday, Claude usage reset and meteor shower."
needs: [time, calendar, holidays, claudeUsage]
default_size:
  width: 16vw
  height: auto
settings:
  meteors:
    type: boolean
    default: true
    description: "Show the next annual meteor shower peak"
i18n:
  ja:
    name: "カウントダウン"
    description: "次の会議・祝日・流星群まで"
    settings:
      meteors: "次の流星群を表示"
