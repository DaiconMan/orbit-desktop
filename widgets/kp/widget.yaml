id: kp
name: Space Weather
version: "1.0.0"
author: DaiconMan
license: MIT
kind: widget
description: "NOAA planetary Kp index: the current value with a calm / active / storm label and 3-hourly bars for the last three days. Hidden while there is no data."
needs: [kp]
default_size:
  width: auto
  height: auto
settings:
  aurora_hint:
    type: boolean
    default: true
    description: "Aurora hint line at Kp 5+ (wording assumes Japan: 北海道 at Kp 7+)"
