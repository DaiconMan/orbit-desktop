id: kp
name: Space Weather
version: "1.0.0"
author: DaiconMan
license: MIT
kind: widget
category: weather
description: "NOAA Kp index (geomagnetic activity) with the last three days as bars."
needs: [kp]
default_size:
  width: auto
  height: auto
settings:
  aurora_hint:
    type: boolean
    default: true
    description: "Aurora hint line at Kp 5+ (wording assumes Japan: 北海道 at Kp 7+)"
i18n:
  ja:
    name: "宇宙天気（Kp）"
    description: "地磁気の Kp 指数と3日間の推移"
    settings:
      aurora_hint: "オーロラの目安を表示（Kp 5 以上）"
