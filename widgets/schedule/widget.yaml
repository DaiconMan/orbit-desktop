id: schedule
name: Schedule
version: "1.1.0"
author: DaiconMan
license: MIT
kind: widget
category: time
description: "Today's calendar as a horizontal timeline with NOW / NEXT and all-day chips."
needs: [calendar, time]
default_size:
  width: 54vw
  height: auto
settings:
  title:
    type: string
    default: "TODAY"
    description: "Eyebrow at the start of the header"
  start_hour:
    type: integer
    default: 8
    min: 0
    max: 23
    description: "The axis starts here (earlier when an event or the current time needs it)"
  end_hour:
    type: integer
    default: 20
    min: 1
    max: 24
    description: "The axis ends here (later when an event or the current time needs it)"
  max_rows:
    type: integer
    default: 10
    min: 1
    max: 20
    description: "Maximum number of timed events shown"
  show_all_day:
    type: boolean
    default: true
    description: "Chips for all-day events"
  backdrop:
    type: boolean
    default: true
    description: "Soft dark scrim behind the timeline for legibility"
  bleed:
    type: number
    default: 0
    min: 0
    max: 10
    description: "Host vw on each side reserved for the scrim (the timeline is inset by this much)"
  hours_before:
    type: number
    default: 2
    min: 0
    max: 12
    description: "Deprecated since 1.1.0 (the axis now spans the day); accepted so older layouts stay valid"
  hours_after:
    type: number
    default: 10
    min: 1
    max: 24
    description: "Deprecated since 1.1.0 (the axis now spans the day); accepted so older layouts stay valid"
  demo:
    type: boolean
    default: false
    description: "Show a dense synthetic day instead of the calendar (preview, like the prototype's ?cal=demo)"
i18n:
  ja:
    name: "予定"
    description: "今日の予定を横のタイムラインで"
    settings:
      title: "見出し"
      start_hour: "タイムラインの開始時刻（時）"
      end_hour: "タイムラインの終了時刻（時）"
      max_rows: "表示する予定の最大数"
      show_all_day: "終日の予定を表示"
      backdrop: "背後をうっすら暗くする"
      bleed: "暗くする範囲の左右の余白（vw）"
      hours_before: "（旧設定・未使用）何時間前から"
      hours_after: "（旧設定・未使用）何時間後まで"
      demo: "デモ表示（架空の予定）"
