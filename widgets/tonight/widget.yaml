id: tonight
name: Tonight
version: "1.0.0"
author: DaiconMan
license: MIT
kind: widget
category: weather
description: "Tonight's sky in words: moon phase, planets, ISS, next meteor shower, sunrise / sunset."
needs: [time, location, iss, weather]
default_size:
  width: auto
  height: auto
settings:
  iss:
    type: boolean
    default: true
    description: "ISS row (needs providers.iss.enabled: true)"
  meteors:
    type: boolean
    default: true
    description: "Next meteor shower peak (Japanese names)"
  sun:
    type: boolean
    default: true
    description: "Sunrise / sunset from the weather forecast"
i18n:
  ja:
    name: "今夜の空"
    description: "月齢・見える惑星・ISS・流星群"
    settings:
      iss: "ISS の通過を表示"
      meteors: "次の流星群を表示"
      sun: "日の出・日の入りを表示"
