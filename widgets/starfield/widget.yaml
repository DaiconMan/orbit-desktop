id: starfield
name: Starfield
version: "1.1.0"
author: DaiconMan
license: MIT
kind: background
description: "The real night sky over your location (stars, Milky Way, planets, Moon, Sgr A*, ISS) with meteors and meteor-shower radiants, network streamlines, an occasional UFO and an optional blurred artwork backdrop."
needs: [system, audio, nowPlaying, location, iss]
assets:
  - data/stars.6.json
reactions:
  hooks:
    twinkle: "Star twinkle strength and speed"
    meteors: "Shooting-star rate (meteor shower at 1.0)"
    heat: "Warm glow from the bottom edge; pulsing edges above 0.7"
    streamlines: "Number, speed and length of the flowing light trails"
    glow: "Milky Way brightness and bright-star flare"
  default:
    cpu: [twinkle, meteors, heat]
    net: streamlines
    audio.bass: glow
settings:
  fps:
    type: integer
    default: 20
    min: 10
    max: 60
    description: "Frame-rate cap while something moves; a quiet sky runs at half of it (20 suits a fanless MacBook Air)"
  milky_way:
    type: boolean
    default: true
  planets:
    type: boolean
    default: true
  moon:
    type: boolean
    default: true
  black_hole:
    type: boolean
    default: true
    description: "Draw Sagittarius A* when it is above the horizon"
  labels:
    type: boolean
    default: true
    description: "Planet / Sgr A* labels (Japanese names when theme.locale is ja)"
  meteors:
    type: boolean
    default: true
  showers:
    type: boolean
    default: true
    description: "On the peak night of an annual meteor shower, extra meteors fly away from its radiant"
  iss:
    type: boolean
    default: true
    description: "Draw the ISS when it is above the horizon (needs providers.iss)"
  streamline_count:
    type: integer
    default: 90
    min: 0
    max: 300
  ufo:
    type: boolean
    default: true
    description: "Easter egg: a UFO crosses the sky every few minutes"
  art_backdrop:
    type: boolean
    default: false
    description: "Blurred artwork of the playing track behind everything (opacity .16, slow fades)"
  vignette:
    type: boolean
    default: true
  scanlines:
    type: boolean
    default: true
  heat_glow:
    type: boolean
    default: true
    description: "Enable the DOM overlay driven by the heat hook"
  time_scale:
    type: number
    default: 1
    min: 1
    max: 10000
    description: "Speed up sky rotation for previews (1 = real time)"
