id: starfield
name: Starfield
version: "1.1.0"
author: DaiconMan
license: MIT
kind: background
description: "The real night sky over your location, with meteors, network streamlines and more."
needs: [system, audio, nowPlaying, location, iss]
assets:
  - data/stars.6.json
reactions:
  hooks:
    twinkle: "Star twinkle strength and speed"
    meteors: "Shooting-star rate (meteor shower at 1.0)"
    heat: "Warm glow from the bottom edge; pulsing edges above 0.7"
    streamlines: "Number, speed and length of the flowing light trails"
    glow: "Milky Way brightness and bright-star flare"
  default:
    cpu: [twinkle, meteors, heat]
    net: streamlines
    audio.bass: glow
settings:
  fps:
    type: integer
    default: 20
    min: 10
    max: 60
    description: "Frame-rate cap while something moves; a quiet sky runs at half of it (20 suits a fanless MacBook Air)"
  milky_way:
    type: boolean
    default: true
    description: "Draw the Milky Way"
  planets:
    type: boolean
    default: true
    description: "Draw the naked-eye planets"
  moon:
    type: boolean
    default: true
    description: "Draw the Moon with its phase"
  black_hole:
    type: boolean
    default: true
    description: "Draw Sagittarius A* when it is above the horizon"
  labels:
    type: boolean
    default: true
    description: "Planet / Sgr A* labels (Japanese names when theme.locale is ja)"
  meteors:
    type: boolean
    default: true
    description: "Shooting stars (rate follows the meteors hook)"
  showers:
    type: boolean
    default: true
    description: "On the peak night of an annual meteor shower, extra meteors fly away from its radiant"
  iss:
    type: boolean
    default: true
    description: "Draw the ISS when it is above the horizon (needs providers.iss)"
  streamline_count:
    type: integer
    default: 90
    description: "Maximum number of network streamlines"
    min: 0
    max: 300
  ufo:
    type: boolean
    default: true
    description: "Easter egg: a UFO crosses the sky every few minutes"
  art_backdrop:
    type: boolean
    default: false
    description: "Blurred artwork of the playing track behind everything (opacity .16, slow fades)"
  vignette:
    type: boolean
    default: true
    description: "Darken the corners"
  scanlines:
    type: boolean
    default: true
    description: "Faint CRT scanlines"
  heat_glow:
    type: boolean
    default: true
    description: "Enable the DOM overlay driven by the heat hook"
  time_scale:
    type: number
    default: 1
    min: 1
    max: 10000
    description: "Speed up sky rotation for previews (1 = real time)"
i18n:
  ja:
    name: "星空"
    description: "現在地の本物の夜空と流れ星"
    settings:
      fps: "フレームレートの上限（fps）"
      milky_way: "天の川"
      planets: "惑星"
      moon: "月"
      black_hole: "いて座A*（ブラックホール）"
      labels: "天体名を表示"
      meteors: "流れ星"
      showers: "流星群の夜は放射点から流す"
      iss: "ISS"
      streamline_count: "光の流れ（通信）の本数"
      ufo: "ときどき UFO"
      art_backdrop: "再生中のジャケットを背景にぼかして表示"
      vignette: "四隅を暗くする"
      scanlines: "走査線"
      heat_glow: "高負荷時に下端を暖色に光らせる"
      time_scale: "空の回転速度（1 = 実時間・確認用）"
