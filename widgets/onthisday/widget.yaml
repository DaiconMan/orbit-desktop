id: onthisday
name: On This Day
version: "1.0.0"
author: DaiconMan
license: MIT
kind: widget
category: life
description: "Today's observances and three historical events (Wikipedia)."
needs: [time, onthisday]
default_size:
  width: auto
  height: auto
settings:
  max_chars:
    type: integer
    default: 46
    min: 10
    max: 200
    description: "Skip events whose text is longer than this (keeps each to two lines)"
  min_year:
    type: integer
    default: 1600
    min: -5000
    max: 3000
    description: "Skip events before this year"
i18n:
  ja:
    name: "今日は何の日"
    description: "今日の記念日と歴史上の出来事"
    settings:
      max_chars: "出来事の文字数の上限"
      min_year: "これより前の年の出来事は出さない"
