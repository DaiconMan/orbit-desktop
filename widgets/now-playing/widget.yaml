id: now-playing
name: Now Playing
version: "1.1.0"
author: DaiconMan
license: MIT
kind: widget
description: "Artwork, title, artist, album and progress of the track playing in Apple Music or Spotify. Glides in when playback starts and slowly dissolves when it stops."
needs: [nowPlaying]
default_size:
  width: auto
  height: auto
settings:
  show_album:
    type: boolean
    default: true
  show_progress:
    type: boolean
    default: true
  show_source:
    type: boolean
    default: true
  max_width:
    type: number
    default: 32
    min: 10
    max: 90
    description: "Max text width in host vw"
