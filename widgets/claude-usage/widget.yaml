id: claude-usage
name: Claude Usage (unofficial)
version: "0.1.0"
author: DaiconMan
license: MIT
kind: widget
category: dev
unofficial: true
description: "Unofficial: remaining Claude Code usage (5-hour / weekly), read from ~/.claude.json."
needs: [claudeUsage]
default_size:
  width: 25vw
  height: auto
settings:
  warn_below:
    type: number
    default: 35
    min: 0
    max: 100
    description: "Amber when the remaining % drops below this"
  critical_below:
    type: number
    default: 15
    min: 0
    max: 100
    description: "Red when the remaining % drops below this"
i18n:
  ja:
    name: "Claude 残量"
    description: "Claude Code の残り（5時間・週間）・非公式"
    settings:
      warn_below: "注意色にする残り（%）"
      critical_below: "警告色にする残り（%）"
