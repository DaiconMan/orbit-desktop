id: clock
name: Clock
version: "1.0.0"
author: DaiconMan
license: MIT
kind: widget
description: "Large thin clock with the date underneath."
needs: [time]
default_size:
  width: auto
  height: auto
settings:
  show_date:
    type: boolean
    default: true
  seconds:
    type: boolean
    default: false
  size:
    type: number
    default: 15
    min: 2
    max: 40
    description: "Clock font size in host vh"
