id: pressure
name: Pressure
version: "1.0.0"
author: DaiconMan
license: MIT
kind: widget
category: weather
description: "Surface pressure for the past 12 h and next 24 h, with a headache warning on steep drops."
needs: [weather]
default_size:
  width: 16vw
  height: auto
settings:
  drop_hpa:
    type: number
    default: 4
    min: 1
    max: 20
    description: "Warn (頭痛注意) when pressure falls at least this much within 6 hours"
i18n:
  ja:
    name: "気圧"
    description: "気圧の推移（前後36時間）と頭痛注意"
    settings:
      drop_hpa: "頭痛注意にする低下幅（6時間で hPa）"
